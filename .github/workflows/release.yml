name: Release Linux binaries

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            linkage: dynamic
            static: 'OFF'
            lto: 'ON'
          - runner: ubuntu-24.04
            arch: x86_64
            linkage: static
            static: 'ON'
            lto: 'OFF'
          - runner: ubuntu-24.04-arm
            arch: aarch64
            linkage: dynamic
            static: 'OFF'
            lto: 'ON'
          - runner: ubuntu-24.04-arm
            arch: aarch64
            linkage: static
            static: 'ON'
            lto: 'OFF'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify release tag matches project version
        if: github.event_name == 'push'
        shell: bash
        run: |
          project_version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([^[:space:]]+).*/\1/p' CMakeLists.txt | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CMake project version $project_version" >&2
            exit 1
          fi

      - name: Determine artifact version
        id: build-meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="manual-${GITHUB_SHA:0:12}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Show toolchain and target architecture
        run: |
          g++ --version
          cmake --version
          printf 'Runner: %s\n' "$(uname -m)"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDIRR_STATIC=${{ matrix.static }}
          -DDIRR_ENABLE_LTO=${{ matrix.lto }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary architecture and linkage
        shell: bash
        run: |
          readelf -h build/dirr > elf-header.txt
          cat elf-header.txt | grep 'Machine:'
          case '${{ matrix.arch }}' in
            x86_64)
              grep -Eq 'Machine:.*X86-64' elf-header.txt
              ;;
            aarch64)
              grep -Eq 'Machine:.*AArch64' elf-header.txt
              ;;
            *)
              echo "Unexpected target architecture: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

          if [[ '${{ matrix.linkage }}' == 'static' ]]; then
            if readelf -l build/dirr | grep -q 'INTERP'; then
              echo 'Expected a statically linked binary, but ELF has an interpreter.' >&2
              exit 1
            fi
          elif ! readelf -l build/dirr | grep -q 'INTERP'; then
            echo 'Expected a dynamically linked binary with an ELF interpreter.' >&2
            exit 1
          fi

      - name: Package binary
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/dirr-package"
          mkdir -p "$package_dir" build/dist
          install -m 755 build/dirr "$package_dir/dirr"
          install -m 644 COPYING "$package_dir/COPYING"

          asset="dirr-${{ steps.build-meta.outputs.label }}-linux-${{ matrix.arch }}"
          if [[ '${{ matrix.linkage }}' == 'static' ]]; then
            asset="${asset}-static"
          fi
          tar -czf "build/dist/${asset}.tar.gz" -C "$package_dir" dirr COPYING
          ls -lh "build/dist/${asset}.tar.gz"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: dirr-${{ steps.build-meta.outputs.label }}-linux-${{ matrix.arch }}-${{ matrix.linkage }}
          path: build/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dirr-${{ github.ref_name }}-linux-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ./*.tar.gz SHA256SUMS
